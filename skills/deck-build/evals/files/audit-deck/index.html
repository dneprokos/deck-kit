<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- deck-kit template · replaces en Audit Fixture Deck Alex Morgan {{date}} 1 5 min A one-slide deck with a deliberate design-token violation, used by the deck-build audit eval. at scaffold time -->
<title>Audit Fixture Deck</title>
<link rel="stylesheet" href="shared.css">
<style>
  body.index {
    padding: 48px 32px 80px;
    min-height: auto;
    justify-content: flex-start;
    align-items: stretch;
  }

  .index-header {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto 36px;
    padding: 0 8px;
  }

  .index-header .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .index-header h1 {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
    background: linear-gradient(90deg, var(--accent-primary), var(--accent-human), var(--accent-ai));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .index-header .lede {
    margin-top: 14px;
    font-size: 1.05rem;
    color: var(--text-secondary);
    max-width: 780px;
    line-height: 1.55;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  .search {
    flex: 1;
    min-width: 280px;
    max-width: 560px;
    padding: 12px 18px;
    background: var(--bg-panel);
    border: 1px solid color-mix(in srgb, var(--accent-primary) 30%, transparent);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .search:focus {
    border-color: var(--accent-primary);
    box-shadow: var(--glow-primary);
  }

  .toolbar .toggle {
    padding: 12px 20px;
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--accent-primary) 30%, transparent);
    border-radius: 10px;
    color: var(--accent-primary);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .toolbar .toggle.active {
    background: color-mix(in srgb, var(--accent-primary) 15%, transparent);
  }

  .toolbar .counter {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 1.5px;
  }

  .parts {
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 34px;
  }

  .part-section h2 {
    font-size: 0.85rem;
    font-family: var(--font-mono);
    color: var(--accent-warn);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px dashed color-mix(in srgb, var(--accent-warn) 25%, transparent);
  }

  .grid-slides {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px;
  }

  .slide-tile {
    background: var(--bg-panel);
    border: 1px solid color-mix(in srgb, var(--surface-tint) 7%, transparent);
    border-radius: 12px;
    padding: 16px 18px 18px;
    position: relative;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 130px;
    transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    overflow: hidden;
  }

  .slide-tile::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent-primary), var(--accent-ai));
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .slide-tile:hover {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--accent-primary) 45%, transparent);
    box-shadow: 0 10px 30px color-mix(in srgb, var(--shadow-color) 40%, transparent), 0 0 0 1px color-mix(in srgb, var(--accent-primary) 12%, transparent);
  }

  .slide-tile:hover::before { opacity: 1; }

  .slide-tile .num {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 2px;
  }

  .slide-tile .title {
    font-size: 1.08rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.35;
  }

  .slide-tile .meta {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-faint);
    letter-spacing: 1px;
  }

  .slide-tile .kind {
    padding: 2px 8px;
    border-radius: 100px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .kind-cover   { background: color-mix(in srgb, var(--accent-primary) 10%, transparent);  color: var(--accent-primary);   border: 1px solid color-mix(in srgb, var(--accent-primary) 25%, transparent); }
  .kind-concept { background: color-mix(in srgb, var(--accent-human) 10%, transparent); color: var(--accent-human);   border: 1px solid color-mix(in srgb, var(--accent-human) 25%, transparent); }
  .kind-phase   { background: color-mix(in srgb, var(--accent-primary) 8%, transparent);  color: var(--accent-primary);   border: 1px solid color-mix(in srgb, var(--accent-primary) 18%, transparent); }
  .kind-demo    { background: color-mix(in srgb, var(--accent-success) 10%, transparent);  color: var(--accent-success);  border: 1px solid color-mix(in srgb, var(--accent-success) 25%, transparent); }
  .kind-qa      { background: color-mix(in srgb, var(--accent-warn) 10%, transparent); color: var(--accent-warn);  border: 1px solid color-mix(in srgb, var(--accent-warn) 25%, transparent); }
  .kind-scale   { background: color-mix(in srgb, var(--accent-ai) 10%, transparent);  color: var(--accent-ai); border: 1px solid color-mix(in srgb, var(--accent-ai) 25%, transparent); }
  .kind-bonus   { background: color-mix(in srgb, var(--accent-highlight) 10%, transparent); color: var(--accent-highlight);   border: 1px solid color-mix(in srgb, var(--accent-highlight) 25%, transparent); }
  .kind-closing { background: color-mix(in srgb, var(--accent-danger) 8%, transparent);  color: var(--accent-danger);    border: 1px solid color-mix(in srgb, var(--accent-danger) 20%, transparent); }

  .slide-tile.hidden { display: none; }

  .empty {
    padding: 40px;
    text-align: center;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.9rem;
  }

  .hint-keys {
    margin-top: 40px;
    padding: 16px 20px;
    background: color-mix(in srgb, var(--bg-panel) 60%, transparent);
    border: 1px dashed color-mix(in srgb, var(--surface-tint) 10%, transparent);
    border-radius: 10px;
    max-width: 1400px;
    margin-left: auto;
    margin-right: auto;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--text-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .hint-keys kbd {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid color-mix(in srgb, var(--surface-tint) 20%, transparent);
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--accent-primary);
    background: color-mix(in srgb, var(--shadow-color) 20%, transparent);
    margin: 0 4px;
  }
</style>
</head>
<body class="index" data-nav-disabled>

<div class="index-header">
  <div class="eyebrow">Alex Morgan · 1 slides · 5 min</div>
  <h1>Audit Fixture Deck</h1>
  <p class="lede">A one-slide deck with a deliberate design-token violation, used by the deck-build audit eval.</p>

  <div class="toolbar">
    <input type="text" class="search" id="search" placeholder="Search by title or number…" autofocus>
    <button class="toggle" id="presenter-toggle">PRESENTER MODE</button>
    <span class="counter" id="counter"></span>
  </div>
</div>

<div class="parts" id="parts"></div>

<div class="hint-keys">
  <span><kbd>→</kbd> <kbd>Space</kbd> next</span>
  <span><kbd>←</kbd> prev</span>
  <span><kbd>Esc</kbd> back to index</span>
  <span><kbd>P</kbd> toggle presenter mode</span>
  <span>Click tile to open slide</span>
</div>

<!-- NO defer: inline script below reads window.WORKSHOP_SLIDES -->
<script src="shared.js"></script>
<script>
(function () {
  // SECTIONS is populated by the deck-build skill when the deck is
  // scaffolded. Each section describes a contiguous range [from, to] of
  // indices into WORKSHOP_SLIDES plus an optional per-tile `kinds` array.
  // Replace the template array below with the real sections at generate time.
  var SECTIONS = [
    // { id: "part-1", label: "Part 1 · Intro (5 min)", range: [0, 0], kinds: ["cover"] },
  ];

  function kindForSlide(idx) {
    // Default: look up the section range, then pick that index's kind.
    for (var s = 0; s < SECTIONS.length; s++) {
      var sec = SECTIONS[s];
      if (idx >= sec.range[0] && idx <= sec.range[1]) {
        if (sec.kinds) {
          var offset = idx - sec.range[0];
          return sec.kinds[offset] || sec.kinds[sec.kinds.length - 1] || "concept";
        }
        // Heuristic fallback for phase/demo sections
        var file = window.WORKSHOP_SLIDES[idx].file;
        if (file.indexOf("demo") !== -1) return "demo";
        if (file.indexOf("phase") !== -1) return "phase";
        return "concept";
      }
    }
    return "concept";
  }

  function kindLabel(kind) {
    return (kind || "slide").toUpperCase();
  }

  function withQuery(href) {
    return window.location.search.indexOf("presenter") !== -1 ? href + "?presenter" : href;
  }

  function buildTile(idx) {
    var slide = window.WORKSHOP_SLIDES[idx];
    var kind = kindForSlide(idx);
    var total = window.WORKSHOP_SLIDES.length;
    var numLabel = String(idx + 1).padStart(2, "0");

    var a = document.createElement("a");
    a.className = "slide-tile";
    a.href = withQuery(slide.file);
    a.setAttribute("data-num", numLabel);
    a.setAttribute("data-title", slide.title.toLowerCase());

    a.innerHTML =
      '<div class="num">' + numLabel + " / " + String(total).padStart(2, "0") + '</div>' +
      '<div class="title">' + slide.title + '</div>' +
      '<div class="meta"><span class="kind kind-' + kind + '">' + kindLabel(kind) + '</span>' +
      '<span class="file">' + slide.file + '</span></div>';

    return a;
  }

  function render() {
    var container = document.getElementById("parts");
    container.innerHTML = "";

    if (!SECTIONS.length) {
      // No sections configured — dump all slides into one grid
      var wrap = document.createElement("div");
      wrap.className = "part-section";
      var grid = document.createElement("div");
      grid.className = "grid-slides";
      for (var i = 0; i < window.WORKSHOP_SLIDES.length; i++) {
        grid.appendChild(buildTile(i));
      }
      wrap.appendChild(grid);
      container.appendChild(wrap);
      return;
    }

    SECTIONS.forEach(function (section) {
      var wrap = document.createElement("div");
      wrap.className = "part-section";
      wrap.id = section.id;

      var h = document.createElement("h2");
      h.textContent = section.label;
      wrap.appendChild(h);

      var grid = document.createElement("div");
      grid.className = "grid-slides";
      for (var i = section.range[0]; i <= section.range[1]; i++) {
        grid.appendChild(buildTile(i));
      }
      wrap.appendChild(grid);
      container.appendChild(wrap);
    });
  }

  function filter() {
    var q = document.getElementById("search").value.trim().toLowerCase();
    var tiles = document.querySelectorAll(".slide-tile");
    var visible = 0;

    tiles.forEach(function (t) {
      var num = t.getAttribute("data-num");
      var title = t.getAttribute("data-title");
      var match = !q || title.indexOf(q) !== -1 || num.indexOf(q) !== -1;
      t.classList.toggle("hidden", !match);
      if (match) visible++;
    });

    var counter = document.getElementById("counter");
    counter.textContent = visible + " / " + tiles.length;
  }

  function initPresenterToggle() {
    var btn = document.getElementById("presenter-toggle");
    var on = window.location.search.indexOf("presenter") !== -1;
    if (on) btn.classList.add("active");

    btn.addEventListener("click", function () {
      var url = new URL(window.location.href);
      if (url.searchParams.has("presenter")) {
        url.searchParams.delete("presenter");
      } else {
        url.searchParams.set("presenter", "");
      }
      window.location.href = url.toString().replace("presenter=", "presenter");
    });
  }

  render();
  filter(); // initial counter
  document.getElementById("search").addEventListener("input", filter);
  initPresenterToggle();
})();
</script>

</body>
</html>
