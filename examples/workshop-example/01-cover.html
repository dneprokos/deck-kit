<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test-Driven Refactoring · Cover</title>
<link rel="stylesheet" href="shared.css">
<style>
  body.cover {
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Orbit field behind everything */
  .orbit-field {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .orbit {
    position: absolute;
    top: 50%;
    left: 50%;
    border: 1px solid color-mix(in srgb, var(--accent-primary) 8%, transparent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .orbit.a { width: 600px;  height: 600px;  }
  .orbit.b { width: 920px;  height: 920px;  border-color: color-mix(in srgb, var(--accent-success) 8%, transparent); }
  .orbit.c { width: 1240px; height: 1240px; border-color: color-mix(in srgb, var(--accent-human) 7%, transparent); }

  .satellite {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    margin-top: -6px;
    border-radius: 50%;
    box-shadow: 0 0 12px currentColor;
  }

  .sat-a { color: var(--accent-primary);  background: var(--accent-primary);  animation: orbit-a 24s linear infinite; }
  .sat-b { color: var(--accent-success); background: var(--accent-success); animation: orbit-b 38s linear infinite reverse; }
  .sat-c { color: var(--accent-human);  background: var(--accent-human);  animation: orbit-c 52s linear infinite; }

  @keyframes orbit-a { to { transform: rotate(360deg) translateX(300px) rotate(-360deg); } }
  @keyframes orbit-b { to { transform: rotate(360deg) translateX(460px) rotate(-360deg); } }
  @keyframes orbit-c { to { transform: rotate(360deg) translateX(620px) rotate(-360deg); } }

  /* Main card */
  .cover-card {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 1100px;
    padding: 60px 40px;
  }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    background: color-mix(in srgb, var(--bg-panel) 65%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent-primary) 35%, transparent);
    border-radius: 100px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 3px;
    color: var(--accent-primary);
    text-transform: uppercase;
    backdrop-filter: blur(6px);
    margin-bottom: 40px;
    animation: fade-in-up 0.8s ease both;
  }

  .kicker .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-success);
    box-shadow: 0 0 8px var(--accent-success);
    animation: breathe 2s ease-in-out infinite;
  }

  .cover-title {
    font-size: 6rem;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 0.95;
    background: linear-gradient(120deg,
      var(--accent-primary)  0%,
      var(--accent-success) 45%,
      var(--accent-human)  100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: title-shimmer 6s ease-in-out infinite, fade-in-up 0.9s ease 0.15s both;
  }

  @keyframes title-shimmer {
    0%, 100% { background-position:   0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .cover-subtitle {
    font-size: 1.55rem;
    font-weight: 400;
    color: var(--text-secondary);
    margin-top: 26px;
    letter-spacing: 0.5px;
    line-height: 1.5;
    animation: fade-in-up 0.9s ease 0.3s both;
  }

  .cover-subtitle strong {
    color: var(--accent-primary);
    font-weight: 600;
  }

  .pill-row {
    margin-top: 46px;
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    animation: fade-in-up 0.9s ease 0.45s both;
  }

  .pill {
    padding: 10px 22px;
    background: color-mix(in srgb, var(--bg-panel) 75%, transparent);
    border: 1px solid color-mix(in srgb, var(--surface-tint) 10%, transparent);
    border-radius: 100px;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    letter-spacing: 1px;
    color: var(--text-secondary);
    backdrop-filter: blur(6px);
  }

  .pill strong {
    color: var(--accent-primary);
    font-weight: 700;
    margin-right: 6px;
  }

  .pill.amber strong { color: var(--accent-warn); }
  .pill.green strong { color: var(--accent-success); }

  /* Meta line */
  .meta-line {
    margin-top: 76px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    flex-wrap: wrap;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    animation: fade-in 1.2s ease 0.7s both;
  }

  .meta-line .sep {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--surface-tint) 15%, transparent);
  }

  .meta-line .speaker {
    color: var(--text-secondary);
  }

  /* Presenter mode */
  body.presenter .cover-title    { font-size: 7.2rem; }
  body.presenter .cover-subtitle { font-size: 1.8rem; }
</style>
</head>
<body class="cover">

<div class="orbit-field">
  <div class="orbit a"><div class="satellite sat-a"></div></div>
  <div class="orbit b"><div class="satellite sat-b"></div></div>
  <div class="orbit c"><div class="satellite sat-c"></div></div>
</div>

<div class="cover-card">
  <div class="kicker">
    <span class="dot"></span>
    Workshop · 90 min · Hands-on
  </div>

  <h1 class="cover-title">Test-Driven<br>Refactoring</h1>

  <p class="cover-subtitle">
    Change the shape of the code without changing its behaviour —
    with a <strong>test safety net</strong> that stays green at every step.
  </p>

  <div class="pill-row">
    <div class="pill"><strong>4</strong> phases</div>
    <div class="pill amber"><strong>1</strong> live demo</div>
    <div class="pill green"><strong>90</strong> min</div>
  </div>

  <div class="meta-line">
    <span class="speaker">Alex Morgan</span>
    <span class="sep"></span>
    <span>2026</span>
    <span class="sep"></span>
    <span>Hands-on Workshop</span>
  </div>
</div>

<script src="shared.js" defer></script>
</body>
</html>
