<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTA · Try /gsd-new-project</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* [CTA] — closing slide with ONE action */

  body.talk.cta {
    align-items: center;
    justify-content: center;
  }

  .cta-slide {
    text-align: center;
    max-width: 1100px;
    padding: 40px;
    position: relative;
    z-index: 1;
  }

  .cta-eyebrow {
    font-family: var(--font-mono);
    color: var(--accent-warn);
    font-size: 0.85rem;
    letter-spacing: 4px;
    margin-bottom: 28px;
    text-transform: uppercase;
    animation: fade-in-up 0.8s ease both;
  }

  .cta-verb {
    font-size: 4rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--text-primary);
    margin-bottom: 40px;
    animation: fade-in-up 0.8s ease 0.15s both;
  }

  .cta-target {
    font-family: var(--font-mono);
    font-size: 1.55rem;
    padding: 18px 32px;
    border: 1px solid var(--accent-warn);
    border-radius: var(--radius-md);
    display: inline-block;
    background: color-mix(in srgb, var(--accent-warn) 4%, transparent);
    box-shadow: var(--glow-warn);
    animation: fade-in-up 0.8s ease 0.3s both;
  }

  .cta-link {
    color: var(--accent-warn);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .cta-link:hover {
    color: var(--text-primary);
  }

  /* Presenter mode */
  body.presenter .cta-verb   { font-size: 4.8rem; }
  body.presenter .cta-target { font-size: 1.8rem; }
</style>
</head>
<body class="talk cta">

<div class="cta-slide">
  <div class="cta-eyebrow">◆ ONE ACTION</div>
  <div class="cta-verb">Try /gsd-new-project</div>
  <div class="cta-target">
    <a href="https://example.com/deck-kit" class="cta-link">example.com/deck-kit</a>
  </div>
</div>

<script src="shared.js" defer></script>
</body>
</html>
