<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memorable Moment · You No Longer Write Code — You Formulate Intent</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* [MEMORABLE] — the one phrase to tweet / remember */

  body.talk.memorable {
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Ambient purple glow */
  body.talk.memorable::after {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 500px;
    background: radial-gradient(
      ellipse at center,
      rgba(213, 0, 249, 0.1) 0%,
      rgba(41, 121, 255, 0.06) 55%,
      transparent 75%
    );
    pointer-events: none;
    z-index: 0;
  }

  .memorable-slide {
    text-align: center;
    max-width: 1100px;
    padding: 40px;
    position: relative;
    z-index: 1;
  }

  .memorable-mark {
    font-family: Georgia, serif;
    font-size: 10rem;
    line-height: 0.8;
    color: var(--accent-purple);
    text-shadow: 0 0 40px rgba(213, 0, 249, 0.5);
    margin-bottom: 20px;
    animation: fade-in 0.8s ease both;
  }

  .memorable-text {
    font-size: 3.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    background: linear-gradient(120deg,
      var(--accent-purple) 0%, var(--accent-blue) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fade-in-up 1s ease 0.2s both;
  }

  .memorable-meta {
    margin-top: 44px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
    animation: fade-in 1s ease 0.5s both;
  }

  .memorable-meta .sep {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-muted);
  }

  /* Presenter mode */
  body.presenter .memorable-text { font-size: 3.8rem; }
</style>
</head>
<body class="talk memorable">

<div class="memorable-slide">
  <div class="memorable-mark">&ldquo;</div>
  <div class="memorable-text">You no longer write code —<br>you formulate intent</div>
  <div class="memorable-meta">
    <span>Alex Morgan</span>
    <span class="sep"></span>
    <span>DevConf 2026</span>
  </div>
</div>

<script src="shared.js" defer></script>
</body>
</html>
