<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Paradigms · Three Paradigms of Interacting with AI</title>
<link rel="stylesheet" href="shared.css">
<style>
  .slide-wrap {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 36px 32px 48px;
  }

  .slide-wrap > header {
    text-align: center;
    margin-bottom: 32px;
  }

  .slide-wrap > header .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .slide-wrap > header h1 {
    font-size: 2.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent-primary), var(--accent-human), var(--accent-ai));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Concept card grid — 3 columns */
  .grid-concept {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-top: 8px;
  }

  .concept-card {
    position: relative;
    background: var(--bg-panel);
    border: 1px solid color-mix(in srgb, var(--surface-tint) 7%, transparent);
    border-radius: var(--radius-lg);
    padding: 32px 28px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease;
  }

  .concept-card:hover {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--accent-primary) 30%, transparent);
  }

  /* Top accent stripe */
  .concept-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, var(--card-from), var(--card-to));
  }

  .concept-card.card-1 { --card-from: var(--accent-danger);  --card-to: var(--accent-warn); }
  .concept-card.card-2 { --card-from: var(--accent-primary); --card-to: var(--accent-human);  border-color: color-mix(in srgb, var(--accent-primary) 35%, transparent); box-shadow: var(--glow-primary); }
  .concept-card.card-3 { --card-from: var(--accent-human); --card-to: var(--accent-success); }

  .card-num {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .card-name {
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text-primary);
  }

  .concept-card.card-2 .card-name { color: var(--accent-primary); }

  .card-desc {
    font-size: 1.05rem;
    color: var(--text-secondary);
    line-height: 1.55;
    flex: 1;
  }

  body.presenter .card-desc { font-size: 1.18rem; }
</style>
</head>
<body>

<div class="slide-wrap">
  <header>
    <div class="eyebrow">◆ CONCEPT · PARADIGMS</div>
    <h1>Three paradigms of interacting with AI</h1>
  </header>

  <div class="grid-concept">

    <div class="concept-card card-1 stagger-item">
      <div class="card-num">01</div>
      <div class="card-name">Copilot</div>
      <div class="card-desc">AI suggests — you accept one line at a time</div>
    </div>

    <div class="concept-card card-2 stagger-item">
      <div class="card-num">02</div>
      <div class="card-name">Chat</div>
      <div class="card-desc">You ask — AI answers in a separate session</div>
    </div>

    <div class="concept-card card-3 stagger-item">
      <div class="card-num">03</div>
      <div class="card-name">Agentic</div>
      <div class="card-desc">You give a goal — AI plans and executes on its own</div>
    </div>

  </div>
</div>

<script src="shared.js" defer></script>
</body>
</html>
