<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recap · Chapter 1 · What We Covered</title>
<link rel="stylesheet" href="shared.css">
<style>
  body.lecture.recap {
    font-size: calc(var(--base-font) * 1.0);
  }

  body.presenter.lecture.recap {
    font-size: calc(var(--base-font) * 1.25);
  }

  .gradient-title {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    background: linear-gradient(90deg, var(--accent-primary), var(--accent-human), var(--accent-ai));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-top: 8px;
  }

  body.presenter .gradient-title { font-size: 2.8rem; }

  .recap-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 36px;
  }

  .recap-card {
    padding: 28px 24px;
    border-radius: var(--radius-md);
    background: var(--bg-panel);
    border: 1px solid color-mix(in srgb, var(--accent-primary) 20%, transparent);
    box-shadow: var(--glow-primary);
    animation: fade-in-up 0.6s ease both;
  }

  .recap-card:nth-child(1) { animation-delay: 0.1s; }
  .recap-card:nth-child(2) { animation-delay: 0.25s; }
  .recap-card:nth-child(3) { animation-delay: 0.4s; }
  .recap-card:nth-child(4) { animation-delay: 0.55s; }

  .recap-num {
    font-family: var(--font-mono);
    color: var(--accent-primary);
    font-size: 0.85rem;
    letter-spacing: 3px;
    margin-bottom: 14px;
  }

  .recap-title {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--text-primary);
  }

  .recap-body {
    font-size: 1rem;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  body.presenter .recap-title { font-size: 1.4rem; }
  body.presenter .recap-body  { font-size: 1.1rem; }
</style>
</head>
<body class="lecture recap">

<div class="slide">
  <header class="slide-header">
    <div class="eyebrow">◆ RECAP · CHAPTER 1</div>
  </header>
  <h1 class="gradient-title">What we covered</h1>
  <div class="recap-grid">
    <div class="recap-card">
      <div class="recap-num">01</div>
      <div class="recap-title">AI Paradigms</div>
      <div class="recap-body">Copilot, Chat, Agentic — each fits a different scope</div>
    </div>
    <div class="recap-card">
      <div class="recap-num">02</div>
      <div class="recap-title">Agentic Context</div>
      <div class="recap-body">AI receives a goal + context + tools and decides how to act on its own</div>
    </div>
    <div class="recap-card">
      <div class="recap-num">03</div>
      <div class="recap-title">Human-in-the-loop</div>
      <div class="recap-body">Control stays with the human through checkpoints and gates</div>
    </div>
  </div>
</div>

<script src="shared.js" defer></script>
</body>
</html>
